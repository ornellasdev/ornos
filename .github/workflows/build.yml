name: Build OrnOS Bootable ISO

on:
  workflow_dispatch: # Permite disparar manualmente com 1 clique
  schedule:
    - cron: '00 12 * * 1' # Roda semanalmente após o build da imagem base

jobs:
  build-iso:
    name: Generate Bootable ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Free Disk Space
        uses: ublue-os/remove-unwanted-software@v7

      - name: Build OrnOS Installer ISO
        uses: jasonn3/build-container-installer@v1.2.4
        with:
          arch: x86_64
          image_name: ornos
          image_repo: ghcr.io/${{ github.repository_owner }}
          image_tag: latest
          version: 41 # Versão base do Fedora utilizada
          iso_name: OrnOS-KDE-NVIDIA-x86_64.iso

      - name: Upload ISO to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest-iso
          name: "OrnOS KDE (Latest ISO)"
          body: "Build automatizada do OrnOS com kernel otimizado, tweaks Nobara e stack NVIDIA pré-integrada."
          files: |
            OrnOS-KDE-NVIDIA-x86_64.iso
            OrnOS-KDE-NVIDIA-x86_64.iso-CHECKSUM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}