# Padrão SteamOS: evita crashes em jogos pesados sob Proton/Wine
vm.max_map_count = 2147483642

# Otimização de ZRAM e Cache de Ficheiros (carregamentos mais rápidos)
vm.swappiness = 10
vm.page-cluster = 0
vm.vfs_cache_pressure = 50

# Evita micro-stuttering de escrita em disco (limites fixos de 256MB e 64MB)
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500

# Elimina picos de frametime causados por desfragmentação de RAM em segundo plano
vm.compaction_proactiveness = 0
vm.watermark_boost_factor = 1
vm.min_free_kbytes = 131072

# Desativa o NMI Watchdog e mitigação de Split Lock para poupar ciclos de CPU
kernel.nmi_watchdog = 0
kernel.split_lock_mitigate = 0
kernel.sched_autogroup_enabled = 1

# Limites de descritores de ficheiros para Wine/Proton, Lutris e ferramentas de desenvolvimento
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288

# Rede Low-Latency: fila Fair Queue (fq), TCP BBR e buffers UDP para jogos competitivos
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.netdev_max_backlog = 16384
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1