# Aumenta o cache de shaders da NVIDIA para 10GB evitando engasgos (stuttering)
__GL_SHADER_DISK_CACHE=1
__GL_SHADER_DISK_CACHE_SIZE=10737418240
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1

# Melhora a sincronização em Wayland/XWayland e ativa FSync/ESync no Proton
PROTON_NO_ESYNC=0
PROTON_NO_FSYNC=0
SDL_VIDEODRIVER=wayland,x11